# main 에 푸시하거나 main 으로 PR 을 올리면 빌드와 단위 테스트를 돌린다.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # gradle/gradle-daemon-jvm.properties 가 JDK 25 데몬을 요구한다
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # v3 는 기본으로 'tools' 패키지를 설치하는데, 구글이 2026-09 에 배포를 중단해 실패한다
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      # compileSdk 37 (android.car.jar 포함)
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and unit test
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug testDebugUnitTest --stacktrace

      - name: Test issue-branch script
        run: node --test .github/scripts/issue-branch.test.js

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
