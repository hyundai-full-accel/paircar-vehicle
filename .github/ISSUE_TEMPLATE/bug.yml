name: 버그
description: 잘못 동작하는 것. 열면 "이슈번호-영어제목" 브랜치가 자동으로 생겨요.
body:
  - type: input
    id: branch
    attributes:
      label: 영어 제목 (브랜치 이름)
      description: 영문으로 짧게. 예) Fix map not loading → 13-fix-map-not-loading 브랜치
      placeholder: Fix map not loading
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: 무슨 일이 있었나요
      placeholder: 어떤 화면에서 무엇을 했고, 어떻게 됐는지
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대한 동작
  - type: input
    id: environment
    attributes:
      label: 환경
      placeholder: Pleos Connect Emulator v2.1.0 / 실차
